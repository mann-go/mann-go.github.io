<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body class="sb-expanded">
    <aside>
        <nav>
            <ul>
                <li>
                    <button type="button" class="active">
                        <i class="bx bx-home-circle"></i>
                        <span>Home</span>
                    </button>
                </li>
                <li>
                    <button type="button" id="add-todo">
                        <i class='bx bxs-message-square-add'></i>
                        <span>Create Todo</span>
                    </button>
                </li>
                <li>
                    <!-- Displays projects like todo grid items, clicking shows a preview? -->
                    <button type="button" id="my-projects">
                        <i class='bx bxs-folder-open'></i>
                        <span>My Projects</span>
                    </button>
                </li>
                <li>
                    <!-- Display the new project form -->
                    <button type="button" id="create-project-btn">
                        <i class='bx bxs-folder-plus'></i>
                        <span>New Project</span>
                    </button>
                </li>
                <li>
                    <h1>DEV TOOLS</h1>
                </li>
                <li>
                    <button type="button" id="log-local-storage">
                        <i class='bx bxs-folder-open'></i>
                        <span>Log Local Storage</span>
                    </button>
                </li>
                <li>
                    <button type="button" id="delete-local-storage">
                        <i class='bx bxs-folder-open'></i>
                        <span>Delete Local Storage</span>
                    </button>
                </li>
                <li>
                    <button type="button" data-resize-btn>
                        <i class='bx bxs-chevrons-right'></i>
                        <span>Collapse</span>
                    </button>
                </li>
            </ul>
        </nav>
    </aside>
    <main>
        <div class="main-header">
            <h1 id="project-title">Dashboard</h1>  
            <p id="project-description"></p>
        </div>

        <div id="grid-container" class="grid-container">
            <h2>Load a project...</h2>
        </div>

        <!-- SELECT PROJECT MODAL -->
        <div class="modal" id="select-project-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h1>My Projects</h1>
                    <span class="close">&times;</span>    
                </div>
                <div id="grid-container-modal" class="grid-container-modal">
                </div>
            </div>
        </div>

        <!-- NEW PROJECT MODAL -->
        <div class="modal" id="new-project-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>New Project</h2>
                    <span class="close">&times;</span>
                </div>
                <form action="" id="new-project-form">
                    <label for="project-name-input">Project Name: </label>
                    <input type="text" name="project-name-input" id="project-name-input" minlength="6" maxlength="25" required>
                    <label for="project-desc-input">Project Description</label>
                    <input type="text" name="project-desc-input" id="project-desc-input" required>
                    <label for="project-dueDate-input">Due Date:</label>
                    <input type="datetime-local" name="project-dueDate-input" id="project-dueDate-input" required>
                    <button type="submit">Create New Project</button>
                </form>
            </div>
        </div>

        <!-- TODO: further form validation -->
        <div class="modal" id="todo-add-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Add Todo</h2>
                    <span class="close">&times;</span>
                </div>
                <form action="" id="todo-add-form">
                    <label for="todo-name">To Do:</label>
                    <input type="text" name="todo-name" id="todo-name" minlength="6" maxlength="25" placeholder="">
                    <!-- <p id="hint">Should be between 6 and 25 characters</p> -->
                    <label for="todo-desc">Description:</label>
                    <input type="text" name="todo-desc" id="todo-desc" required>
                    <label for="todo-due">Due Date:</label>
                    <input type="datetime-local" name="todo-due" id="todo-due" required>
                    <label for="todo-priority">Priority:</label>
                    <select name="todo-priority" id="todo-priority" required>
                        <option value="high">High</option>
                        <option value="medium" selected>Medium</option>
                        <option value="low">Low</option>
                    </select>
                    <label for="todo-notes">Notes:</label>
                    <input type="text" name="todo-notes" id="todo-notes">
                    <button type="submit">Create Todo</button>
                </form>
            </div>
        </div>

        <!-- TODO: further form validation -->
        <div class="modal" id="todo-edit-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Edit Todo</h2>
                    <span class="close">&times;</span>     
                </div>

                <form action="" id="todo-edit-form">
                    <label for="edit-todo-name">To Do:</label>
                    <input type="text" name="edit-todo-name" id="edit-todo-name" required>
                    <label for="edit-todo-desc">Description:</label>
                    <input type="text" name="edit-todo-desc" id="edit-todo-desc" required>
                    <label for="edit-todo-due">Due Date:</label>
                    <input type="datetime" name="edit-todo-due" id="edit-todo-due" required>
                    <label for="edit-todo-priority">Priority:</label>
                    <select name="edit-todo-priority" id="edit-todo-priority" required>
                        <option value="high">High</option>
                        <option value="medium" selected>Medium</option>
                        <option value="low">Low</option>
                    </select>
                    <label for="edit-todo-notes">Notes:</label>
                    <input type="text" name="edit-todo-notes" id="edit-todo-notes">
                    <button type="submit" id="saveTodoButton">Save changes</button>
                </form>
            </div>
        </div>
  
        <!-- PROJECT TEMPLATE -->
        <template id="project-template">
                <div class="grid-item">
                    <div id="project" class="project hoverable">
                        <h2 id="project-name"></h2>
                        <p id="project-desc"></p>
                        <p id="project-dueDate"></p>
                        <ul id="todos">
                            <h2>TODOs:</h2>
                        </ul>
                    </div>
                </div> 
        </template>

        <!-- TODO TEMPLATE -->
        <template id="todo-template">
            <div class="grid-item">
                <div class="todo hoverable">
                    <div class="todo-header">
                        <h2 id="name"></h2>
                        <div class="todo-icons">
                            <button class="todo-button" id="editTodoButton">
                                <span><i class="bx bx-edit"></i></span>
                            </button>
                            <button class="todo-button" id="todoStatusButton">
                                <span><i class="bx bx-check"></i></span>
                            </button>
                            <button class="todo-button" id="deleteTodoButton">
                                <span><i class="bx bx-trash"></i></span>
                            </button>
                        </div>
                    </div>
                    <div class="todo-body"></div>
                </div>
            </div>
        </template>
    </main>
</body>
</html>
