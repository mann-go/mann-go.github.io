<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header>

    </header>
    <main>
        <div class="form-container">
            <form action="" id="weather-forecast-form">
                <label class="form-item" for="location-input" id="location-input-label" aria-label="location">
                    <input type="text" id="location-input" placeholder="What's the weather in..." required>
                    <button type="submit"><i class='bx bx-search'></i></button> 
                </label>
            </form>
        </div>

        <div class="weather-container">
            <div class="weather-item">
                <div class="weather-item-header">
                    <h2 id="date">DATE</h2>
                    <p id="conditions">condition</p>
                    <p id="curr-temp">CURR TEMP</p>
                </div>
                <div class="weather-item-body">
                    <div class="forecast-item">
                        <img src="" alt="weather icon">
                        <h3>temp 1</h3>
                        <p>% chance</p>
                    </div>
                    <div class="forecast-item">
                        <img src="" alt="weather icon">
                        <p>temp 2</p>
                        <p>% chance</p>
                    </div>
                    <div class="forecast-item">
                        <img src="" alt="weather icon">
                        <p>temp 3</p>
                        <p>% chance</p>
                    </div>
                    <div class="forecast-item">
                        <img src="" alt="weather icon">
                        <p>temp 4</p>
                        <p>% chance</p>
                    </div>
                    <div class="forecast-item">
                        <img src="" alt="weather icon">
                        <p>temp 5</p>
                        <p>% chance</p>
                    </div>
                    <div class="forecast-item">
                        <img src="" alt="weather icon">
                        <p>temp 6</p>
                        <p>% chance</p>
                    </div>
                    <div class="forecast-item">
                        <img src="" alt="weather icon">
                        <p>temp 7</p>
                        <p>% chance</p>
                    </div>
                    <div class="forecast-item">
                        <img src="" alt="weather icon">
                        <p>temp 8</p>
                        <p>% chance</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <!-- <p>Copyright</p> -->
    </footer>

    <template id="forecast-item-template">
        <div class="forecast-item">
            <h3 id="datetime"></h3>
            <img id="icon" src="" alt="weather icon">
            <p id="conditions"></p>
            <p id="feelslike"></p>
            <p id="humidity"></p>
            <p id="temp"></p>
        </div>   
    </template>
</body>
</html>
